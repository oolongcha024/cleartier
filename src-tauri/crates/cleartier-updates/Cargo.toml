[package]
name = "cleartier-updates"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.28"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tempfile = "3"
minisign-verify = "0.3"
base64 = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
