[package]
name = "cleartier"
version = "0.1.0"
description = "基于 EasyTier 的跨平台本地桌面客户端"
edition = "2024"
rust-version = "1.95"

[lib]
name = "cleartier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/cleartier-core", "crates/cleartier-config"]
resolver = "3"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
cleartier-core = { path = "crates/cleartier-core" }
cleartier-config = { path = "crates/cleartier-config" }
tauri-plugin-dialog = "2.8.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
auto-launch = "0.6.0"

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2.7.0"
