<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <title>ClearTier · 更新预览</title>
    <style>
      .update-preview-controls {
        position: fixed;
        right: 24px;
        bottom: 20px;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: 16px;
        color: var(--md-sys-color-on-surface-variant);
        background: var(--md-sys-color-surface-container);
        box-shadow: 0 4px 20px #0001;
        font-size: 12px;
      }
      .update-preview-controls select {
        padding: 8px;
        border-radius: 8px;
        color: var(--md-sys-color-on-surface);
        background: var(--md-sys-color-surface-container-high);
        border: 1px solid var(--md-sys-color-outline-variant);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <aside class="update-preview-controls" aria-label="更新状态预览">
      <span>更新预览 · 模拟数据</span>
      <select aria-label="预览状态">
        <option value="available">发现更新</option>
        <option value="idle">尚未检查</option>
        <option value="current">已是最新</option>
        <option value="checking">检查中</option>
        <option value="downloading">下载中</option>
        <option value="indeterminate">下载中 · 未知大小</option>
        <option value="failed">检查失败</option>
        <option value="signature">下载验证失败</option>
        <option value="ready">安装确认</option>
        <option value="portable">免安装版</option>
      </select>
    </aside>
    <script type="module" src="./updates-preview.js"></script>
  </body>
</html>
