name: Check
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.96.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config protobuf-compiler libclang-dev libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Check version consistency and progression
        env:
          VERSION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A force-push can put event.before outside the history fetched by checkout.
          if [[ -n "$VERSION_BASE_REF" && ! "$VERSION_BASE_REF" =~ ^0+$ ]] &&
            ! git cat-file -e "${VERSION_BASE_REF}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags origin "$VERSION_BASE_REF"; then
              echo "::error::Cannot fetch version comparison base $VERSION_BASE_REF. Version progression must be checked."
              exit 1
            fi
          fi
          pnpm version:check
      - run: pnpm test
      - run: pnpm build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --workspace
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p cleartier-config -p cleartier-core -p cleartier-updates
      - name: Install browser runner
        run: |
          npm install --global agent-browser@0.38.0
          agent-browser install --with-deps
      - run: pnpm test:browser
      - name: Check minimum window and reduced motion
        env:
          BROWSER_WIDTH: '900'
          BROWSER_HEIGHT: '600'
          BROWSER_COLOR_SCHEME: dark
          BROWSER_REDUCED_MOTION: reduce
        run: pnpm test:browser network-editor-session advanced-disclosure peer-disclosure desktop-lifecycle navigation-overflow
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures
          if-no-files-found: ignore
          archive: true
          path: .cache/browser/*.png
