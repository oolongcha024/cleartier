name: Publish update index

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published, unpublished, deleted, edited]

permissions:
  contents: read

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy update index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout index publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate published channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm updates:generate "$RUNNER_TEMP/update-site"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload update index
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/update-site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public index
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL%/}/updates/updates.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o "$RUNNER_TEMP/published-updates.json"
          cmp "$RUNNER_TEMP/update-site/updates/updates.json" "$RUNNER_TEMP/published-updates.json"
