name: Publish update index

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published, unpublished, deleted, edited]

permissions:
  contents: read

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy update index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout index publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Generate published channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm updates:generate "$RUNNER_TEMP/update-site"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload update index
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/update-site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify public index
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "${SITE_URL%/}/updates/updates.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o "$RUNNER_TEMP/published-updates.json"
          cmp "$RUNNER_TEMP/update-site/updates/updates.json" "$RUNNER_TEMP/published-updates.json"
