name: Build Windows
run-name: Windows x64 (${{ inputs.bundle || 'all' }}) · ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bundle:
        description: '产物类型：exe 为完整免安装 ZIP'
        type: choice
        required: true
        default: all
        options:
          - all
          - exe
          - nsis

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Native Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      BUILD_BUNDLE: ${{ inputs.bundle || 'all' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Cache pnpm store
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.96.0'
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Set up protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: '21.12'
          repo-token: ${{ github.token }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Check build environment
        run: |
          git config --global core.longpaths true
          $protoc = (Get-Command protoc).Source
          $include = Join-Path (Split-Path (Split-Path $protoc)) 'include'
          if (-not (Test-Path (Join-Path $include 'google/protobuf/timestamp.proto'))) {
            throw "Missing protoc standard includes: $include"
          }
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROTOC_INCLUDE=$include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force artifacts/windows-x64/checks | Out-Null
          @(
            "Image: $env:ImageOS $env:ImageVersion"
            (node --version)
            (pnpm --version)
            (rustc --version)
            (protoc --version)
            "7zip: $((Get-Command 7z).Source)"
            "MSVC: $((Get-Command cl).Source)"
          ) | Set-Content artifacts/windows-x64/checks/environment.txt -Encoding utf8
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check version and release tag
        run: pnpm version:check
      - name: Build and verify Windows packages
        run: pnpm build:windows $env:BUILD_BUNDLE
      - name: Upload verified packages
        id: packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cleartier-windows-x64-${{ inputs.bundle || 'all' }}-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/windows-x64/cleartier-windows-x64.zip
            artifacts/windows-x64/nsis/*-setup.exe
            artifacts/windows-x64/build-info.json
            artifacts/windows-x64/latest.json
            artifacts/windows-x64/checks/
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: artifacts/windows-x64/checks/

  publish:
    name: Publish Windows release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Download this build's verified packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/windows-release
      - name: Upload to draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/windows-release
        run: node scripts/publish-release.mjs "$RELEASE_DIRECTORY"
