name: Build Windows
run-name: Windows x64 (${{ inputs.bundle || 'all' }}) · ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bundle:
        description: '产物类型：exe 为完整免安装 ZIP'
        type: choice
        required: true
        default: all
        options:
          - all
          - exe
          - nsis

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Native Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
      diagnostics_artifact_id: ${{ steps.diagnostics.outputs.artifact-id }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      BUILD_BUNDLE: ${{ inputs.bundle || 'all' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.96.0'
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Set up Windows build tools
        run: ./scripts/windows/setup-build-tools.ps1
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Check build environment
        run: |
          git config --global core.longpaths true
          New-Item -ItemType Directory -Force artifacts/windows-x64/checks | Out-Null
          @(
            "Image: $env:ImageOS $env:ImageVersion"
            (node --version)
            (pnpm --version)
            (rustc --version)
            (protoc --version)
            "7zip: $((Get-Command 7z).Source)"
            "MSVC: $((Get-Command cl).Source)"
          ) | Set-Content artifacts/windows-x64/checks/environment.txt -Encoding utf8
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check version and release tag
        run: pnpm version:check
      - name: Build and verify Windows packages
        run: pnpm build:windows $env:BUILD_BUNDLE
      - name: Upload verified packages
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleartier-windows-x64-${{ inputs.bundle || 'all' }}-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          archive: true
          path: |
            artifacts/windows-x64/cleartier-windows-x64.zip
            artifacts/windows-x64/nsis/*-setup.exe
            artifacts/windows-x64/latest.json
      - name: Upload build diagnostics
        id: diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          archive: true
          path: |
            artifacts/windows-x64/build-info.json
            artifacts/windows-x64/checks/

  verify-artifacts:
    name: Verify Windows artifacts
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Restore packages and build evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }},${{ needs.windows.outputs.diagnostics_artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/windows-verify
      - name: Verify restored layout and SHA-256
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/windows-verify
          BUILD_BUNDLE: ${{ inputs.bundle || 'all' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { lstatSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = process.env.PACKAGE_DIRECTORY;
          const info = JSON.parse(readFileSync(join(directory, 'build-info.json'), 'utf8'));
          assert.equal(info.source.commit, process.env.GITHUB_SHA);
          assert.equal(info.source.ref, process.env.GITHUB_REF);
          assert.equal(info.target, 'x86_64-pc-windows-msvc');
          assert.equal(info.mode, process.env.BUILD_BUNDLE);
          assert.match(info.version, /^\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.[1-9]\d*)?$/);
          const expected = [];
          if (info.mode !== 'nsis') expected.push('cleartier-windows-x64.zip');
          if (info.mode !== 'exe') expected.push('latest.json', `nsis/ClearTier_${info.version}_x64-setup.exe`);
          assert.deepEqual(info.files.map(file => file.path).sort(), expected.sort());
          for (const file of info.files) {
            const path = join(directory, file.path);
            assert(lstatSync(path).isFile());
            const bytes = readFileSync(path);
            assert(bytes.length > 0);
            assert.equal(bytes.length, file.size);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), file.sha256);
          }
          console.log(`Verified ${info.files.length} restored packages for ${info.version}.`);
          JS

  publish:
    name: Publish Windows release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, verify-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Download verified packages and internal build evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.windows.outputs.artifact_id }},${{ needs.windows.outputs.diagnostics_artifact_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/windows-release
      - name: Upload to draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/windows-release
        run: node scripts/publish-release.mjs "$RELEASE_DIRECTORY"

  update-index:
    name: Publish update index
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/update-index.yml
